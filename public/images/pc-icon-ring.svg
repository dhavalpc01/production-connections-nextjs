<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 515" width="514" height="515">
  <title>Production Connections icon ring</title>
  <!-- The brand play-button mark 10 times round a circle, each one leaning
       and overlapping the next the way the theme's glass plates did, with
       a soft light glow. The page spins it (waRotation360minus) and
       glass.css pulses its shine. -->
  <defs>
    <linearGradient id="r-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10C8D6"/><stop offset="0.48" stop-color="#9CF6E6"/><stop offset="0.52" stop-color="#22D3DA"/><stop offset="1" stop-color="#0BC4D3"/></linearGradient>
    <linearGradient id="r-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD400"/><stop offset="0.45" stop-color="#FF8A0A"/><stop offset="0.55" stop-color="#FFD54A"/><stop offset="1" stop-color="#FFD000"/></linearGradient>
    <linearGradient id="r-grey" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#B0B0B0"/><stop offset="0.45" stop-color="#3C3C3C"/><stop offset="0.55" stop-color="#8A8A8A"/><stop offset="1" stop-color="#C2C2C2"/></linearGradient>
    <!-- glow: a blurred, brightened copy under the artwork -->
    <filter id="r-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1.4 0 0 0 0.08  0 1.4 0 0 0.08  0 0 1.4 0 0.08  0 0 0 0.9 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="r-icon" stroke-linejoin="round">
      <g stroke-width="34" opacity="0.82">
        <polygon points="122,44 640,322 538,394 120,203" fill="url(#r-cyan)" stroke="url(#r-cyan)"/>
        <polygon points="120,246 222,290 274,736 124,812" fill="url(#r-gold)" stroke="url(#r-gold)"/>
        <polygon points="318,632 690,352 814,433 326,744" fill="url(#r-grey)" stroke="url(#r-grey)"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="12">
        <polygon points="122,44 640,322 538,394 120,203"/>
        <polygon points="120,246 222,290 274,736 124,812"/>
        <polygon points="318,632 690,352 814,433 326,744"/>
      </g>
    </g>
  </defs>
  <g filter="url(#r-glow)">
    <use href="#r-icon" transform="translate(369.0 257.0) rotate(125.0) scale(0.235) translate(-470 -430)"/>
    <use href="#r-icon" transform="translate(347.6 322.8) rotate(161.0) scale(0.235) translate(-470 -430)"/>
    <use href="#r-icon" transform="translate(291.6 363.5) rotate(197.0) scale(0.235) translate(-470 -430)"/>
    <use href="#r-icon" transform="translate(222.4 363.5) rotate(233.0) scale(0.235) translate(-470 -430)"/>
    <use href="#r-icon" transform="translate(166.4 322.8) rotate(269.0) scale(0.235) translate(-470 -430)"/>
    <use href="#r-icon" transform="translate(145.0 257.0) rotate(305.0) scale(0.235) translate(-470 -430)"/>
    <use href="#r-icon" transform="translate(166.4 191.2) rotate(341.0) scale(0.235) translate(-470 -430)"/>
    <use href="#r-icon" transform="translate(222.4 150.5) rotate(377.0) scale(0.235) translate(-470 -430)"/>
    <use href="#r-icon" transform="translate(291.6 150.5) rotate(413.0) scale(0.235) translate(-470 -430)"/>
    <use href="#r-icon" transform="translate(347.6 191.2) rotate(449.0) scale(0.235) translate(-470 -430)"/>
  </g>
</svg>
